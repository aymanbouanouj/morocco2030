# Temporary maintenance workflow on an isolated branch. Remove before merging.
name: One-time npm lockfile repair
on:
  push:
    branches:
      - fix/security-lockfile-20261023
    paths:
      - .github/workflows/one-time-npm-security-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'aymanbouanouj/morocco2030' && github.ref == 'refs/heads/fix/security-lockfile-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Update the affected transitive npm dependency
        shell: bash
        run: |
          set -euo pipefail
          npm update follow-redirects --package-lock-only --ignore-scripts --no-audit
          git diff --exit-code -- package.json
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const info = lock.packages['node_modules/follow-redirects'];
          if (!info) throw new Error('follow-redirects is missing from the lockfile');
          const parts = info.version.split('.').map(Number);
          if (parts.length !== 3 || parts.some(n => !Number.isInteger(n)) ||
              parts[0] !== 1 || parts[1] < 16 || (parts[1] === 16 && parts[2] < 1)) {
            throw new Error('The locked follow-redirects version is still vulnerable: ' + info.version);
          }
          console.log('Resolved patched follow-redirects version: ' + info.version);
          NODE
      - name: Verify installation, audit, and frontend build
        run: |
          set -euo pipefail
          npm ci
          npm audit
          npm run build
      - name: Commit only the verified lockfile to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git add -- package-lock.json
          git diff --cached --quiet && { echo 'No lockfile changes found'; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): refresh vulnerable follow-redirects lockfile'
          git push origin HEAD:fix/security-lockfile-20261023
